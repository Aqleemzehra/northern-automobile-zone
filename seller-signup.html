<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Registration - NAZ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-container {
            width: 430px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo img {
            width: 90px;
            height: auto;
        }

        h2 {
            text-align: center;
            color: #0b1f3a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0b1f3a;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #0b1f3a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #12345c;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #0b1f3a;
            font-weight: bold;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .back-home {
            text-align: center;
            margin-top: 15px;
        }

        .back-home a {
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="signup-container">

    <div class="logo">
        <a href="index.html">
            <img src="assets/logo.png" alt="NAZ Logo">
        </a>
    </div>

    <h2>Seller Registration</h2>

    <p class="subtitle">
        Create your Seller account on NAZ
    </p>

    <form id="sellerSignupForm">

        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input
                type="text"
                id="full_name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Gmail</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your Gmail"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
                type="text"
                id="phone"
                placeholder="03XXXXXXXXX"
                maxlength="11"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
            >
        </div>

        <button type="submit">
            Create Seller Account
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
        Already have a Seller account?
        <a href="seller-login.html">Login</a>
    </div>

    <div class="back-home">
        <a href="index.html">← Back to Home</a>
    </div>

</div>


<script>

document.getElementById("sellerSignupForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const full_name = document.getElementById("full_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("message");

    // Gmail validation
    const gmailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

    if (!gmailPattern.test(email)) {
        message.style.color = "red";
        message.textContent = "Please enter a valid Gmail address.";
        return;
    }

    // Phone validation
    if (!/^03[0-9]{9}$/.test(phone)) {
        message.style.color = "red";
        message.textContent = "Phone number must be exactly 11 digits and start with 03.";
        return;
    }

    // Password validation
    if (password.length < 5) {
        message.style.color = "red";
        message.textContent = "Password must contain at least 5 characters.";
        return;
    }

    // Confirm password
    if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match.";
        return;
    }

    try {

        const response = await fetch("http://localhost:5000/api/seller/signup", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                full_name: full_name,
                email: email,
                phone: phone,
                password: password,
                confirmPassword: confirmPassword
            })

        });

        const data = await response.json();

        if (data.success) {

            message.style.color = "green";
            message.textContent = "Seller account created successfully.";

            setTimeout(() => {
                window.location.href = "seller-login.html";
            }, 1000);

        } else {

            message.style.color = "red";
            message.textContent = data.message;

        }

    } catch (error) {

        console.error("Seller signup error:", error);

        message.style.color = "red";
        message.textContent = "Unable to connect to server.";

    }

});

</script>

</body>
</html>
